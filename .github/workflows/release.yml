name: Release

# Push a tag like v0.2.0 to build the installer and publish it as a GitHub release.
on:
  push:
    tags: ["v*"]

jobs:
  installer:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - run: dotnet run --project app/NovaMotion.SmokeTest -c Release
      - run: dotnet publish app/NovaMotion.App -c Release -r win-x64 -o dist
      - name: Download the runtime
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: powershell -NoProfile -ExecutionPolicy Bypass -File setup/Get-Runtime.ps1
      - name: Build the installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup --no-progress -y | Out-Null }
          $version = "${{ github.ref_name }}".TrimStart("v")
          & $iscc /Q "/DAppVersion=$version" installer\NovaMotion.iss
          if ($LASTEXITCODE -ne 0) { exit 1 }
      - name: Publish the release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $file = (Get-ChildItem dist-installer\*.exe | Select-Object -First 1).FullName
          gh release create "${{ github.ref_name }}" $file --title "NOVA Motion ${{ github.ref_name }}" --generate-notes
