name: Release

# Builds the installer and publishes it as a GitHub release. Either push a tag like v0.2.0, or
# run it from Actions > Release > Run workflow with the version: it then tags the commit itself.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, e.g. v0.2.0"
        required: true
        default: "v0.2.0"

env:
  TAG: ${{ github.event.inputs.version || github.ref_name }}

jobs:
  installer:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - run: dotnet run --project app/NovaMotion.SmokeTest -c Release
      - run: dotnet publish app/NovaMotion.App -c Release -r win-x64 -o dist
      - name: Download the runtime
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: powershell -NoProfile -ExecutionPolicy Bypass -File setup/Get-Runtime.ps1
      - name: Build the installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup --no-progress -y | Out-Null }
          $version = "$env:TAG".TrimStart("v")
          & $iscc /Q "/DAppVersion=$version" installer\NovaMotion.iss
          if ($LASTEXITCODE -ne 0) { exit 1 }
      - name: Publish the release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $file = (Get-ChildItem dist-installer\*.exe | Select-Object -First 1).FullName
          # Written notes for this version when there are some (docs/releases/<tag>.md), else GitHub's list of changes.
          # --target tags this commit when the tag doesn't exist yet (a run started by hand).
          $notes = "docs/releases/$env:TAG.md"
          if (Test-Path $notes) {
            gh release create "$env:TAG" $file --target "$env:GITHUB_SHA" --title "NOVA Motion $env:TAG" --notes-file $notes
          } else {
            gh release create "$env:TAG" $file --target "$env:GITHUB_SHA" --title "NOVA Motion $env:TAG" --generate-notes
          }
          if ($LASTEXITCODE -ne 0) { exit 1 }
