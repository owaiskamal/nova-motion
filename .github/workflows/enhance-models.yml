# Gathers the AI models Enhance uses into one release of this repository ("enhance-models-v1"), so
# setup downloads a few small pinned files instead of vs-mlrt's 800 MB model archive. Every model's
# licence allows commercial use; THIRD_PARTY_NOTICES.md lists them.
#   - Real-ESRGAN realesr-general-x4v3 and -wdn-x4v3 (BSD-3-Clause), converted to ONNX here by
#     tools/realesrgan_to_onnx.py, plus the half-and-half blend Real-ESRGAN uses by default
#   - Real-ESRGAN x4plus and x4plus anime 6B (BSD-3-Clause), the full RRDB networks behind "Max
#     detail" for photos, converted the same way and checked against a PyTorch run of the original
#   - NAFNet REDS width 64 (MIT): "Remove noise and blur" for photos, converted to ONNX here by
#     tools/restore_to_onnx.py with NAFNet's own network code at a pinned commit
#   - Real-CUGAN up2x (MIT), Real-ESRGAN AnimeVideo v3 (BSD-3-Clause), DPIR deblocking (MIT), as ONNX
#     from vs-mlrt's model releases
name: Enhance models

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release to create or update
        default: enhance-models-v3
      publish:
        description: Publish the release (off = only keep the models as a workflow artifact, to try them)
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  models:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TAG: ${{ github.event.inputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install numpy==2.2.6 onnx==1.18.0 onnxruntime==1.22.0 && sudo apt-get install -y p7zip-full >/dev/null

      - name: Real-ESRGAN general models, converted to ONNX
        run: |
          set -e
          mkdir -p out pth
          base=https://github.com/xinntao/Real-ESRGAN/releases/download/v0.2.5.0
          curl -sSLf -o pth/x4v3.pth $base/realesr-general-x4v3.pth
          curl -sSLf -o pth/wdn.pth $base/realesr-general-wdn-x4v3.pth
          echo "8dc7edb9ac80ccdc30c3a5dca6616509367f05fbc184ad95b731f05bece96292  pth/x4v3.pth" | sha256sum -c
          echo "1641f8c4464b9f097c9fdda5589273713f67cf59f3d909e0bd688f0cee269dca  pth/wdn.pth" | sha256sum -c
          python tools/realesrgan_to_onnx.py pth/x4v3.pth out/realesr-general-x4v3.onnx
          python tools/realesrgan_to_onnx.py pth/wdn.pth out/realesr-general-wdn-x4v3.onnx
          python tools/realesrgan_to_onnx.py pth/x4v3.pth out/realesr-general-mid-x4v3.onnx --blend pth/wdn.pth 0.5

      - name: Real-ESRGAN x4plus models (Max detail), converted to ONNX
        run: |
          set -e
          curl -sSLf -o pth/x4plus.pth https://github.com/xinntao/Real-ESRGAN/releases/download/v0.1.0/RealESRGAN_x4plus.pth
          curl -sSLf -o pth/x4plus_anime_6B.pth https://github.com/xinntao/Real-ESRGAN/releases/download/v0.2.2.4/RealESRGAN_x4plus_anime_6B.pth
          echo "4fa0d38905f75ac06eb49a7951b426670021be3018265fd191d2125df9d682f1  pth/x4plus.pth" | sha256sum -c
          echo "f872d837d3c90ed2e05227bed711af5671a6fd1c9f7d7e91c911a61f155e99da  pth/x4plus_anime_6B.pth" | sha256sum -c
          python tools/realesrgan_to_onnx.py pth/x4plus.pth out/RealESRGAN_x4plus.onnx
          python tools/realesrgan_to_onnx.py pth/x4plus_anime_6B.pth out/RealESRGAN_x4plus_anime_6B.onnx

      - name: Check the RRDB conversion against PyTorch
        run: |
          pip install -q torch --index-url https://download.pytorch.org/whl/cpu
          python tools/check_rrdb_onnx.py pth/x4plus.pth out/RealESRGAN_x4plus.onnx
          python tools/check_rrdb_onnx.py pth/x4plus_anime_6B.pth out/RealESRGAN_x4plus_anime_6B.onnx

      - name: Photo restoration model (NAFNet REDS), converted to ONNX with its own code
        # NAFNet's deblurring network trained on REDS (blurred, compressed frames): it removes noise, blur
        # and JPEG damage together. Chosen over SCUNet (plastic skin, shifted colour), NAFNet SIDD (soft)
        # and NAFNet GoPro (left phone noise) on a real phone photo
        run: |
          set -e
          pip install -q torch==2.7.1 --index-url https://download.pytorch.org/whl/cpu
          pip install -q gdown==5.2.0
          mkdir -p arch
          curl -sSLf -o arch/NAFNet_arch.py https://raw.githubusercontent.com/megvii-research/NAFNet/2b4af71ebe098a92a75910c233a3965a3e93ede4/basicsr/models/archs/NAFNet_arch.py
          echo "01b22270cc93f1bb90c0e3e4490e98b023fcf73f8552860b4a9ee880ce5c6967  arch/NAFNet_arch.py" | sha256sum -c
          # The weights are on NAFNet's authors' Google Drive (linked from its README)
          gdown -q -O pth/nafnet_reds64.pth 14D4V4raNYIOhETfcuuLI3bGLB-OYIv6X
          echo "175fe8b3cdf3abedfbc87769779c3d9f491e05bb2e73ea9d627883f90a4b2df3  pth/nafnet_reds64.pth" | sha256sum -c
          python tools/restore_to_onnx.py nafnet-reds-64 arch/NAFNet_arch.py pth/nafnet_reds64.pth out/nafnet_reds64.onnx

      - name: Anime and clean-up models from vs-mlrt's model releases
        run: |
          set -e
          want="up2x-latest-conservative.onnx up2x-latest-no-denoise.onnx up2x-latest-denoise3x.onnx realesr-animevideov3.onnx drunet_deblocking_color.onnx"
          mkdir -p x
          for tag in model-20211209 model-20220923; do
            for url in $(gh api repos/AmusementClub/vs-mlrt/releases/tags/$tag -q '.assets[] | select(.name|test("(?i)cugan|realesrgan|dpir")) | .browser_download_url'); do
              echo "download $url"
              curl -sSLf -o dl.7z "$url"
              7z x -y -ox dl.7z >/dev/null
              rm dl.7z
            done
          done
          for f in $want; do
            hit=$(find x -name "$f" | head -1)
            if [ -z "$hit" ]; then echo "::error::$f not found in vs-mlrt's model releases"; find x -name '*.onnx' | head -50; exit 1; fi
            cp "$hit" out/
          done

      - name: Check every model runs
        run: |
          python - <<'EOF'
          import glob, numpy as np, onnxruntime as ort
          for f in sorted(glob.glob("out/*.onnx")):
              s = ort.InferenceSession(f, providers=["CPUExecutionProvider"])
              feed = {}
              for i in s.get_inputs():
                  # Fixed sizes where the model has them; DPIR takes the picture and its strength as 4 channels
                  shape = [d if isinstance(d, int) else (1 if k == 0 else 3 if k == 1 else 64) for k, d in enumerate(i.shape)]
                  x = np.random.rand(*shape).astype(np.float32)
                  if shape[1] == 4:
                      x[:, 3] = 5 / 255
                  feed[i.name] = x
              y = s.run(None, feed)[0]
              print(f, [(i.name, i.shape) for i in s.get_inputs()], y.shape)
          EOF

      - name: Keep the models to try them (a draft release, seen only by the repository's owners)
        if: ${{ !inputs.publish }}
        run: |
          set -e
          gh release delete "$TAG-trial" --yes >/dev/null 2>&1 || true
          gh release create "$TAG-trial" out/*.onnx --draft --target "$GITHUB_SHA" --title "Enhance models trial ($TAG)" --notes "Models to try before publishing $TAG; not for setup."

      - name: Publish
        if: ${{ inputs.publish }}
        run: |
          set -e
          cd out
          sha256sum *.onnx | tee SHA256SUMS
          while read -r sum name; do echo "::notice title=$name::$sum"; done < SHA256SUMS
          notes="AI models for NOVA Studio's Enhance, gathered and pinned for setup/Get-EnhanceModels.ps1. Real-ESRGAN general, x4plus and x4plus anime 6B (BSD-3-Clause, https://github.com/xinntao/Real-ESRGAN), Real-CUGAN (MIT, https://github.com/bilibili/ailab), DPIR (MIT, https://github.com/cszn/DPIR), NAFNet (MIT, https://github.com/megvii-research/NAFNet); ONNX files from vs-mlrt (https://github.com/AmusementClub/vs-mlrt) and converted by tools/realesrgan_to_onnx.py and tools/restore_to_onnx.py."
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" *.onnx SHA256SUMS --clobber
          else
            gh release create "$TAG" *.onnx SHA256SUMS --target "$GITHUB_SHA" --title "Enhance models ($TAG)" --notes "$notes" --prerelease
          fi
