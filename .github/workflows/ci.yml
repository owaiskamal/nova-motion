name: CI

on:
  push:
  pull_request:

jobs:
  core:
    name: Core library and view-model tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - run: dotnet run --project app/NovaMotion.SmokeTest -c Release

  ui-lint:
    name: XAML checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 tests/ui/lint_xaml.py app/NovaMotion.App app/NovaMotion.Core

  app:
    name: Windows app build and UI run
    runs-on: windows-latest
    needs: [ui-lint]
    permissions:
      contents: write   # to publish screenshots to the ci-screenshots branch
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: PowerShell scripts parse
        shell: pwsh
        run: |
          $bad = 0
          foreach ($f in Get-ChildItem setup -Filter *.ps1) {
            $errs = $null
            [System.Management.Automation.Language.Parser]::ParseFile($f.FullName, [ref]$null, [ref]$errs) | Out-Null
            foreach ($e in $errs) { Write-Host "::error file=setup/$($f.Name),line=$($e.Extent.StartLineNumber)::$($e.Message)"; $bad++ }
          }
          if ($bad) { exit 1 }
      - name: Core tests on Windows (paths and plugins differ from Linux)
        run: dotnet run --project app/NovaMotion.SmokeTest -c Release
      - name: Build
        run: dotnet publish app/NovaMotion.App -c Release -r win-x64 -o dist

      # The player runtime (mpv, VapourSynth, RIFE, MVTools, yt-dlp), cached between runs
      - uses: actions/cache@v4
        id: runtime
        with:
          path: runtime
          key: runtime-${{ hashFiles('setup/Get-Runtime.ps1') }}
      - name: Download the runtime
        if: steps.runtime.outputs.cache-hit != 'true'
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          New-Item -ItemType Directory -Force uitest | Out-Null
          powershell -NoProfile -ExecutionPolicy Bypass -File setup/Get-Runtime.ps1
          $code = $LASTEXITCODE
          if (Test-Path runtime\setup.log) { Copy-Item runtime\setup.log uitest\ }
          if ($code -ne 0) {
            # Annotations are readable through the API even where logs aren't
            # (GitHub keeps 10 per step, so send the failure itself and a few lines before it)
            $lines = @(Get-Content runtime\setup.log | Where-Object { $_.Trim() -and $_ -notmatch '^\*+$|^(Windows PowerShell|PowerShell) transcript|^(Start|End) time|^Username|^RunAs|^Configuration|^Machine|^Host Application|^Process ID|^PS(Version|Edition|Compat|Remoting|Serialization)|^BuildVersion|^CLRVersion|^WSManStackVersion' })
            $i = [Array]::FindIndex([string[]]$lines, [Predicate[string]]{ param($l) $l -match 'SETUP FAILED' })
            $pick = if ($i -ge 0) { $lines[[Math]::Max(0, $i - 3)..[Math]::Min($lines.Count - 1, $i + 5)] } else { $lines | Select-Object -Last 9 }
            ($pick -join " | ") -split '(?<=\G.{3500})' | Select-Object -First 3 | ForEach-Object { Write-Host "::error::$_" }
            exit $code
          }
      - name: Copy the engine into the runtime
        shell: cmd
        run: |
          copy /y engine\novamotion.vpy runtime\
          copy /y engine\novamotion_trt.py runtime\
          copy /y engine\novamotion_build.py runtime\
          copy /y engine\jobs.py runtime\
          copy /y engine\parallax.py runtime\
          copy /y engine\enhance.py runtime\
          copy /y engine\photo.py runtime\
          xcopy /e /y /i /q engine\mpv runtime\mpv\portable_config

      - name: Setup check (the summary build.cmd ends with)
        shell: pwsh
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File setup\Setup.ps1 -CheckOnly
          if ($LASTEXITCODE -ne 0) { exit 1 }

      # Walk through the UI on the runner's desktop and screenshot each screen
      - name: UI run with screenshots
        shell: pwsh
        run: |
          $out = Join-Path $PWD "uitest"
          New-Item -ItemType Directory -Force $out | Out-Null
          $env:NOVAMOTION_UITEST = $out
          # A short test video for the export run, made with mpv's own encoder
          $clip = Join-Path $env:RUNNER_TEMP "export-test.mp4"
          & runtime\mpv\mpv.exe --no-config "av://lavfi:testsrc2=size=640x360:rate=25:duration=2" --o=$clip --ovc=libx264 --of=mp4 --log-file="$out\make-clip.log" 2>&1 | Select-Object -Last 15 | ForEach-Object { Write-Host "    $_" }
          if (Test-Path $clip) { $env:NOVAMOTION_UITEST_FILE = $clip } else { Write-Host "::warning::could not make the export test clip" }
          $p = Start-Process -FilePath "dist\NovaMotion.exe" -PassThru
          if (-not $p.WaitForExit(420000)) { $p.Kill(); Write-Host "::error::UI run did not finish in 7 minutes" }
          Write-Host "exit code: $($p.ExitCode)"
          $log = Join-Path $out "uitest.log"
          if (Test-Path $log) { Get-Content $log } else { Write-Host "::error::no uitest.log" }
          if (Test-Path runtime\versions.json) { Copy-Item runtime\versions.json $out }
          $appdata = Join-Path $env:APPDATA "NovaMotion"
          if (Test-Path $appdata) { Copy-Item "$appdata\*.log" $out -ErrorAction SilentlyContinue }
          if (Test-Path "$appdata\exports") { Copy-Item "$appdata\exports\*" $out -ErrorAction SilentlyContinue }
          if (Test-Path "$out\crash.log") { Get-Content "$out\crash.log" }
          # Check the exported copy: it must exist and play at 60 fps
          $exported = Get-ChildItem $env:RUNNER_TEMP -Filter "export-test (NOVA Motion*" -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($exported) {
            $probe = & runtime\mpv\mpv.exe --no-config --vo=null --ao=null --frames=1 --term-playing-msg='fps=${container-fps} frames=${estimated-frame-count} size=${width}x${height}' $exported.FullName 2>&1 | Select-String "fps="
            & runtime\mpv\mpv.exe --no-config --vo=null --ao=null --untimed "--vf=lavfi=[showinfo]" --msg-level=all=no,ffmpeg=v "--log-file=$out\export-frames.log" $exported.FullName | Out-Null
            Write-Host "exported: $($exported.Name) $probe"
            "exported: $($exported.Name) $probe" | Add-Content $log
            if ("$probe" -notmatch "fps=60") { Write-Host "::error::exported file is not 60 fps: $probe"; exit 1 }
            $first = Select-String -Path "$out\export-frames.log" -Pattern "n:\s*0 .*mean:\[(\d+)" | Select-Object -First 1
            if ($first -and [int]$first.Matches[0].Groups[1].Value -lt 30) { Write-Host "::error::exported file starts with a black frame"; exit 1 }
            # 2 s at 25 fps = 50 frames -> 120 at 60 fps; none may go missing at the end
            $decoded = (Select-String -Path "$out\export-frames.log" -Pattern "pts_time:").Count
            "decoded frames: $decoded" | Add-Content $log
            if ($decoded -ne 120) { Write-Host "::error::exported file has $decoded frames, expected 120"; exit 1 }
          } elseif ($env:NOVAMOTION_UITEST_FILE) { Write-Host "::error::no exported file"; exit 1 }
          $text = if (Test-Path $log) { Get-Content $log -Raw } else { "" }
          if ($text -match "CRASH|UNHANDLED|ERROR" -or -not (Test-Path "$out\01-home.png")) { exit 1 }
      - name: Build the installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup --no-progress -y | Out-Null }
          $version = ([xml](Get-Content app/NovaMotion.App/NovaMotion.App.csproj)).Project.PropertyGroup.Version | Select-Object -First 1
          & $iscc /Q "/DAppVersion=$version" installer\NovaMotion.iss
          if ($LASTEXITCODE -ne 0) { exit 1 }
          Get-ChildItem dist-installer | Format-Table Name, Length
      # After the installer, so the depth model isn't packed into it (it downloads on first use)
      - name: Animate a picture with the real depth model (no GPU on the runner, so the processor)
        shell: pwsh
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File setup\Get-StudioParts.ps1
          if ($LASTEXITCODE -ne 0) { Get-Content runtime\setup-studio.log -Tail 40; exit 1 }
          New-Item -ItemType Directory -Force uitest | Out-Null
          foreach ($move in "push", "sway") {
            & runtime\mpv\python.exe -I runtime\parallax.py --image site\img\compare\parrots-after.jpg --out "uitest\animate-$move.mp4" `
                --move $move --seconds 2 --fps 30 --model runtime\studio\depth-anything-v2-small.onnx `
                --mpv runtime\mpv\mpv.exe --packages runtime\studio\packages
            if ($LASTEXITCODE -ne 0) { exit 1 }
            $f = Get-Item "uitest\animate-$move.mp4"
            if ($f.Length -lt 20KB) { Write-Host "::error::animate-$move.mp4 is only $($f.Length) bytes"; exit 1 }
            Write-Host "::notice title=Animate a picture::$move -> $($f.Length) bytes"
          }
      # Enhance's frame preview: mpv writes one PNG with the options ExportPlan uses
      - name: Frame preview writes a PNG
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force uitest | Out-Null
          # mpv.exe is a windowed program: PowerShell has to be told to wait for it
          $p = Start-Process runtime\mpv\mpv.exe -Wait -PassThru -NoNewWindow -ArgumentList @(
              "--no-config", "--player-operation-mode=cplayer", "--idle=no", "--log-file=uitest\frame.log", "--o=uitest\frame.png",
              "--of=image2", "--ofopts=update=1", "--ovc=png", "--no-audio", "--start=1", "--frames=2",
              "av://lavfi:testsrc=duration=3:size=640x360:rate=24")
          $f = Get-Item uitest\frame.png -ErrorAction SilentlyContinue
          if (-not $f -or $f.Length -lt 1KB) {
            Get-Content uitest\frame.log -Tail 30 -ErrorAction SilentlyContinue
            Write-Host "::error::no frame preview PNG (mpv exit $($p.ExitCode))"; exit 1
          }
          Write-Host "::notice title=Frame preview::PNG $($f.Length) bytes, mpv exit $($p.ExitCode)"
      # The app's downloads (setup/Progress.ps1): progress lines, and resuming a broken download
      - name: Downloads report progress and resume
        shell: pwsh
        run: |
          $test = {
            . .\setup\Progress.ps1
            $url = "https://files.pythonhosted.org/packages/source/n/numpy/numpy-2.2.6.tar.gz"
            $dir = Join-Path $env:RUNNER_TEMP "dl"; New-Item -ItemType Directory -Force $dir | Out-Null
            Save-NovaDownload -Url $url -OutFile "$dir\whole.tgz" -Label "numpy source"
            $whole = Get-Item "$dir\whole.tgz"
            # A download broken after its first 3 MB, then run again
            $bytes = [IO.File]::ReadAllBytes($whole.FullName)
            [IO.File]::WriteAllBytes("$dir\resumed.tgz.part", $bytes[0..(3MB - 1)])
            Save-NovaDownload -Url $url -OutFile "$dir\resumed.tgz" -Label "numpy source"
            $a = (Get-FileHash $whole.FullName).Hash; $b = (Get-FileHash "$dir\resumed.tgz").Hash
            Write-Host "sizes $($whole.Length) $((Get-Item "$dir\resumed.tgz").Length) same=$($a -eq $b)"
          }
          $out = powershell -NoProfile -Command $test.ToString()
          $out | Select-Object -Last 4
          $bars = @($out | Where-Object { $_ -match '^@@progress \d.* MB of .* MB, ' })
          if (-not ($out -match 'same=True')) { Write-Host "::error::a resumed download isn't the same file"; exit 1 }
          if ($bars.Count -lt 1) { Write-Host "::error::no download progress lines"; exit 1 }
          Write-Host "::notice title=Downloads::$($bars.Count) progress lines; a resumed download matches the whole one"
      # The Enhance models' setup exactly as users run it: download, checksums, the Vulkan runtime
      - name: Enhance models setup
        shell: pwsh
        run: |
          # As the app's AI Models page runs it: hidden, its progress read from the @@ lines
          $out = powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File setup\Get-EnhanceModels.ps1 -NoPrepare
          $code = $LASTEXITCODE
          $out | Select-Object -Last 15
          if ($code -ne 0) { Get-Content runtime\setup-enhance.log -Tail 30; exit 1 }
          $steps = @($out | Where-Object { $_ -match '^@@step \d' })
          $bars = @($out | Where-Object { $_ -match '^@@progress \d.* MB of .* MB/s' })
          Write-Host "::notice title=Setup progress::$($steps.Count) steps, $($bars.Count) download progress lines"
          $downloads = @($steps | Where-Object { $_ -match 'Downloading' })
          if ($steps.Count -lt 1 -or ($downloads.Count -gt 0 -and $bars.Count -lt 1)) { Write-Host "::error::the setup didn't report its progress for the app"; exit 1 }
          $models = Get-ChildItem runtime\mpv\vs-plugins\models -Recurse -Filter *.onnx | Where-Object { $_.FullName -notmatch '\\rife\\' }
          Write-Host "::notice title=Enhance models::$($models.Count) models, $([math]::Round(($models | Measure-Object Length -Sum).Sum / 1MB)) MB"
          if ($models.Count -lt 8) { Write-Host "::error::only $($models.Count) Enhance models installed"; exit 1 }
          if (-not (Test-Path runtime\mpv\vsmlrt.py)) { Write-Host "::error::vsmlrt.py missing"; exit 1 }
      # Enhance a photo on the runtime's own Python: Pillow and numpy load, the picture is read and handed
      # to the models. The runner has no graphics card, so the models themselves may not run here.
      - name: Enhance a photo starts on the runtime
        shell: pwsh
        run: |
          $out = & runtime\mpv\python.exe -I runtime\photo.py --image uitest\frame.png --out uitest\photo.png `
                   --settings '{"preset": "film", "scale": 2}' --packages runtime\studio\packages 2>&1 | Out-String
          Write-Host $out
          if ($out -notmatch "stage enhance") { Write-Host "::error::Enhance a photo didn't get to the models"; exit 1 }
          if (Test-Path uitest\photo.png) { Write-Host "::notice title=Enhance a photo::$((Get-Item uitest\photo.png).Length) bytes" }
          else { Write-Host "::notice title=Enhance a photo::read the picture and reached the models (no GPU on the runner)" }
          exit 0
      # Uploads never fail the build: when the account's artifact storage is full, the build itself is still good
      - uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: NovaMotion-Setup
          path: dist-installer/*.exe
          retention-days: 5
      - uses: actions/upload-artifact@v4
        if: always()
        continue-on-error: true
        with:
          name: ui-screenshots
          path: uitest
          retention-days: 3
      # Also keep the latest screenshots on a branch of their own (one commit, replaced each run),
      # so they can be looked at with plain git
      - name: Publish screenshots to the ci-screenshots branch
        if: always() && github.event_name == 'push'
        shell: pwsh
        run: |
          if (-not (Test-Path uitest)) { exit 0 }
          $dir = Join-Path $env:RUNNER_TEMP "shots"
          New-Item -ItemType Directory -Force $dir | Out-Null
          Copy-Item uitest\* $dir -Recurse -Force
          Set-Location $dir
          "Screenshots from CI run $env:GITHUB_RUN_ID, commit $env:GITHUB_SHA on $env:GITHUB_REF_NAME" | Set-Content README.md
          git init -q -b ci-screenshots
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "UI screenshots for $env:GITHUB_REF_NAME $env:GITHUB_SHA"
          git push -q -f "https://x-access-token:$env:GH_TOKEN@github.com/$env:GITHUB_REPOSITORY.git" ci-screenshots
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  vsmlrt-models:
    name: vs-mlrt model releases (info)
    runs-on: ubuntu-latest
    steps:
      - env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for tag in external-models contrib-models; do
            names=$(gh api "repos/AmusementClub/vs-mlrt/releases/tags/$tag" --jq '[.assets[] | select(.name | test("rife";"i")) | "\(.name) \(.size)"] | join(" ; ")' || echo "none")
            echo "::notice title=$tag::$names"
          done

  engine:
    name: Engine tests (VapourSynth, no GPU)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install vapoursynth vapoursynth-mvtools numpy
      - run: python tests/engine/test_engine.py engine/novamotion.vpy
      - run: python tests/engine/test_enhance.py engine/novamotion.vpy
      - run: python tests/engine/test_jobs.py
      - run: pip install numpy pillow onnxruntime onnx
      - run: python tests/engine/test_parallax.py
      - run: python tests/engine/test_photo.py
      - run: python tests/engine/test_generate.py

  generative-runner:
    name: Generative detail against SeedVR2's real runner
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: The runner at the commit setup-generate.cmd installs
        run: |
          commit=$(grep -oP '\$RunnerCommit\s*=\s*"\K[0-9a-f]{40}' setup/Get-Generate.ps1)
          git init -q runner && git -C runner fetch -q --depth 1 https://github.com/numz/ComfyUI-SeedVR2_VideoUpscaler $commit && git -C runner checkout -q FETCH_HEAD
      - name: Its argument parser takes our command lines
        run: pip install pillow numpy && SEEDVR2_RUNNER=runner python tests/engine/test_generate.py
      - name: The pinned packages install and the runner starts (PyTorch for CPU here, CUDA on the PC)
        run: |
          pip install -q torch==2.8.0 torchvision==0.23.0 --index-url https://download.pytorch.org/whl/cpu
          pip install -q -r setup/generate-requirements.txt
          cd runner && python inference_cli.py --help | head -5

  player-script:
    name: mpv Lua script tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get install -y lua5.4
      - run: luac5.4 -p engine/mpv/scripts/novamotion.lua
      - working-directory: tests/lua
        run: TESTCFG=/tmp/nm-cfg.json lua5.4 run.lua ../../engine/mpv/scripts/novamotion.lua

  extension:
    name: Browser extension checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: node --check extension/background.js
      - run: node -e "JSON.parse(require('fs').readFileSync('extension/manifest.json'))"
