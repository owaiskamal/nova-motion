# NovaMotion hotkeys (the rest of mpv's defaults still apply)
Ctrl+s  script-binding novamotion/toggle        # smoothing on/off
Ctrl+e  script-binding novamotion/cycle-engine  # RIFE TensorRT -> RIFE -> MVTools
Ctrl+t  script-binding novamotion/cycle-target  # display / 60 / 120 / x2
Ctrl+d  script-binding novamotion/toggle-demo   # split-screen before/after
Ctrl+r  script-binding novamotion/toggle-vsr    # RTX Video Super Resolution (experimental)
Ctrl+i  script-binding novamotion/info          # show current settings
