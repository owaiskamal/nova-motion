# NovaMotion player defaults (copied into runtime\mpv\portable_config by setup).
# Personal overrides: %APPDATA%\NovaMotion\mpv-user.conf (loaded by the app).

# Decode on the GPU, then copy frames back so the VapourSynth engine can read them
hwdec=auto-copy
hwdec-codecs=all

vo=gpu-next
target-colorspace-hint=auto

# Scaling. mpv's "high-quality" profile uses EWA Lanczos, which on a 4K screen costs real GPU
# time on every one of the 60 frames a second, time RIFE needs. Spline36 looks practically the
# same for video upscaling at a fraction of the cost.
scale=spline36
cscale=spline36
dscale=mitchell
correct-downscaling=yes
linear-downscaling=yes
sigmoid-upscaling=yes
deband=no

# Lock playback to the display clock so the generated frames land evenly.
# mpv's own blend-interpolation stays off: NovaMotion makes real frames instead.
video-sync=display-resample
interpolation=no

# Audio stays in sync while the filter buffers frames
hr-seek-framedrop=no
audio-buffer=0.3

# Streaming: read well ahead so network hiccups never reach the screen
cache=yes
demuxer-max-bytes=400MiB
demuxer-readahead-secs=30

# Online video (YouTube etc.) through yt-dlp
ytdl=yes
ytdl-format=bestvideo[height<=?1080][vcodec!*=av01]+bestaudio/bestvideo[height<=?1080]+bestaudio/best

# UI
keep-open=yes
osd-font-size=28
osd-duration=1800
save-position-on-quit=no

# Diagnostics (the NovaMotion app redirects this to %APPDATA%\NovaMotion\mpv.log)
log-file=~~/mpv.log
